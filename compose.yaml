# Structure de base, proche de la production.
# Développement : docker compose -f compose.yaml -f compose.dev.yaml up --build
name: gestion-absences

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-absences}
      # Compte propriétaire : création du schéma et migrations uniquement.
      POSTGRES_USER: ${POSTGRES_USER:-absences_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      # Compte applicatif, à droits restreints, créé par db/init/01-roles.sh.
      APP_DB_USER: ${APP_DB_USER:-absences_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD manquant dans .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - interne

  # Applique les migrations avec le compte propriétaire, puis s'arrête.
  # L'API ne démarre qu'après sa réussite et ne reçoit jamais ce mot de passe.
  migrations:
    build:
      context: ./api
      target: prod
    command: ["node", "scripts/migrer.js"]
    restart: "no"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-absences}
      DB_USER: ${POSTGRES_USER:-absences_owner}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - interne

  api:
    build:
      context: ./api
      target: prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-absences}
      DB_USER: ${APP_DB_USER:-absences_app}
      DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD manquant dans .env}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST manquant dans .env}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM manquant dans .env}
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - interne

  web:
    build:
      context: ./web
      target: prod
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Seul point d'entrée publié. Le HTTPS est à terminer sur le reverse proxy de l'infrastructure.
      - "${WEB_PORT:-8080}:8080"
    networks:
      - interne

volumes:
  db-data:

networks:
  interne:
